name: macOS Simulator (fix/mac-simulator)

# Builds only the macOS Corona Simulator app from this branch, on a GitHub-hosted runner (the
# Daily Build's macOS jobs need self-hosted "xcode-27" runners). No templates, DMG or notarization:
# the app is ad-hoc signed and uploaded as an artifact.
on:
  push:
    branches:
      - fix/mac-simulator
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    env:
      BUILD_NUMBER: "3736"
      YEAR: "2026"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Stamp build number (as the official 2026.3736)
        run: |
          echo "MONTH=$(date +%-m)" >> "$GITHUB_ENV"
          echo "DAY=$(date +%-d)" >> "$GITHUB_ENV"
          echo "BUILD=$YEAR.$BUILD_NUMBER" >> "$GITHUB_ENV"
      - run: ./tools/GHAction/process_sources.sh
      - name: Ad-hoc signing in the project's script phases (no Corona Labs certificate here)
        run: |
          grep -c "Developer ID Application: Corona Labs Inc" platform/mac/ratatouille.xcodeproj/project.pbxproj || true
          sed -i '' 's/Developer ID Application: Corona Labs Inc/-/g' platform/mac/ratatouille.xcodeproj/project.pbxproj
      - name: Build Corona Simulator.app (rttplayer)
        run: |
          set +e
          xcodebuild -project platform/mac/ratatouille.xcodeproj -target rttplayer -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= > xcodebuild.log 2>&1
          rc=$?
          # Errors as annotations: readable through the public API without signing in.
          grep -E "error:|\*\* BUILD|Command .* failed|returned a non-zero" xcodebuild.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -3 xcodebuild.log | while IFS= read -r l; do echo "::notice::${l:0:900}"; done
          if [ $rc -ne 0 ]; then
            echo "---- context of failed commands ----"
            grep -n -B2 -A25 -E "^CodeSign |error:|errSecInternal|resource fork|code object is not signed" xcodebuild.log | grep -v "^\S*-    export " | tail -150
          fi
          exit $rc
      - name: Package
        run: |
          APP="platform/mac/build/Release/Corona Simulator.app"
          test -d "$APP" || { echo "::error::no app at $APP"; ls platform/mac/build/Release | head -40; exit 1; }
          # Xcode signing was off: ad-hoc sign the whole bundle, inside out. No hardened runtime, so the
          # Simulator loads unsigned plugins as the official one does with disable-library-validation.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          codesign -dv "$APP" 2>&1 | head -5 || true
          mkdir -p output
          ditto -c -k --keepParent "$APP" "output/Corona-Simulator-mac-$YEAR.$BUILD_NUMBER-${GITHUB_SHA::8}.zip"
          ls -l output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simulator-macOS-app
          path: output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
